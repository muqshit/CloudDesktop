[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cloudpc]
command=/usr/local/bin/start-desktop.sh
user=vscode
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/cloudpc.log
stderr_logfile=/var/log/supervisor/cloudpc-error.log
